<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Crear Usuario</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 350px; display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: bold; font-size: 14px; }
        input, select, button { padding: 8px; font-size: 14px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>Formulario de Prueba</h2>

    <form action="crearUsuario2.php" method="POST">
        <div>
            <label for="name">Nombre:</label><br>
            <input type="text" id="name" name="name" value="Carlos" required>
        </div>

        <div>
            <label for="surname">Apellidos:</label><br>
            <input type="text" id="surname" name="surname" value="García Pérez" required>
        </div>

        <div>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" value="123456" required>
        </div>

        <div>
            <label for="telefono">Teléfono:</label><br>
            <input type="tel" id="telefono" name="telefono" value="600123456" required>
        </div>

        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" value="carlos@ejemplo.com" required>
        </div>

        <div>
            <label for="sex">Sexo:</label><br>
            <select id="sex" name="sex">
                <option value="H" selected>Hombre</option>
                <option value="M">Mujer</option>
                <option value="O">Otro</option>
            </select>
        </div>

        <div>
            <label for="fecha_nacimiento">Fecha de nacimiento:</label><br>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" value="2000-01-15" required>
        </div>

        <button type="submit">Enviar y Guardar en BD</button>
    </form>

</body>
</html>
